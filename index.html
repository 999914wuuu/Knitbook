<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>織圖本</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="織圖本">
<meta name="theme-color" content="#f7efe4">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#f7efe4;--card:#fffaf2;--ink:#5a4636;--mute:#a69280;--line:#eee1cf;--accent:#d4875a;--accent-ink:#fff;
  --pad:#f2c3ad;--seam:#ebd3bd;--rep:#c4846a;--repbg:#fbede3;--wool:#fffdf8;--woolline:#e8d6c1;--face:#7a5a44;
  --sh:0 1px 0 rgba(150,110,80,.06),0 12px 28px -16px rgba(140,95,60,.35);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#211b17;--card:#2c241f;--ink:#f1e5d6;--mute:#a8988a;--line:#3a3029;--accent:#e39a6c;--accent-ink:#2a1d14;
  --pad:#a5705a;--seam:#4a3c32;--rep:#e0a286;--repbg:#362a24;--wool:#efe4d6;--woolline:#cdb9a3;--face:#6b4e3b;
  --sh:0 12px 28px -16px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211b17;--card:#2c241f;--ink:#f1e5d6;--mute:#a8988a;--line:#3a3029;--accent:#e39a6c;--accent-ink:#2a1d14;
  --pad:#a5705a;--seam:#4a3c32;--rep:#e0a286;--repbg:#362a24;--wool:#efe4d6;--woolline:#cdb9a3;--face:#6b4e3b;
  --sh:0 12px 28px -16px rgba(0,0,0,.6);color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.6 "Huninn","Zen Maru Gothic","PingFang TC","Noto Sans TC",-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 120px}
.hide{display:none!important}

/* home */
.hero{display:flex;align-items:center;gap:12px;padding:10px 4px 18px}
.hero svg{width:62px;height:54px;flex:none}
.hero h1{margin:0;font-size:26px;line-height:1.2;letter-spacing:1px}
.hero p{margin:2px 0 0;color:var(--mute);font-size:14px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px dashed var(--seam);background:transparent;border-radius:22px;padding:16px;font-size:16px;color:var(--accent);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pc{display:block;text-decoration:none;color:inherit;background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:8px;position:relative}
.pc::after{content:"";position:absolute;inset:5px;border:1.5px dashed var(--seam);border-radius:18px;pointer-events:none}
.pc .cv{aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--repbg);display:flex;align-items:center;justify-content:center}
.pc .cv img{width:100%;height:100%;object-fit:cover;display:block}
.pc .cv svg{width:60%}
.pc .nm{font-size:16px;margin:8px 6px 0;line-height:1.3}
.pc .mt{font-size:12.5px;color:var(--mute);margin:2px 6px 6px}
.mini{height:5px;border-radius:5px;background:var(--line);margin:0 6px 6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent);border-radius:5px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.empty svg{width:120px;height:104px}

/* pattern header */
header.ph{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px 0;border-bottom:1px solid var(--line)}
.ph .in{max-width:640px;margin:0 auto}
.ph .top{display:flex;align-items:center;gap:8px}
.back{border:0;background:var(--card);box-shadow:var(--sh);width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.ph h1{margin:0;font-size:21px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .prog{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:6px;margin:10px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
nav.tabs{display:flex;margin-top:4px}
nav.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:11px 0;border-bottom:2.5px solid transparent;font-size:15px}
nav.tabs button.on{color:var(--ink);border-color:var(--accent)}

/* rows */
.row{background:var(--card);border-radius:22px;margin-bottom:12px;box-shadow:var(--sh);position:relative}
.row.cur::after{content:"";position:absolute;inset:5px;border:1.5px dashed var(--accent);border-radius:18px;pointer-events:none;opacity:.7}
.rh{display:flex;align-items:center;gap:12px;padding:14px 14px 12px 18px}
.rn{font-size:22px;min-width:46px;line-height:1.1}
.row.cur .rn{color:var(--accent)}
.cnt{flex:1;font-size:13px;color:var(--mute);line-height:1.4;min-width:0}
.z{display:block;font-size:14px;color:var(--mute);margin-top:2px}
body.noz .z{display:none}
.ok{border:0;background:var(--repbg);color:var(--ink);border-radius:999px;padding:9px 15px;font-size:14px;display:flex;align-items:center;gap:4px;flex:none;position:relative;z-index:1}
.ok svg{width:16px;height:16px}
.row.done .ok{background:var(--accent);color:var(--accent-ink)}
.row.done .rn,.row.done .cnt{opacity:.55}
.row.done .rh{cursor:pointer}
.row.done:not(.open) .body{display:none}
.body{padding:0 18px 14px}
ol{list-style:none;margin:0;padding:0}
li.s{padding:9px 0;border-top:1.5px dashed var(--line);display:flex;gap:12px;cursor:pointer}
ol>li.s:first-child{border-top:0}
li.s .k{color:var(--mute);font-size:13px;min-width:22px;padding-top:3px;font-variant-numeric:tabular-nums;display:flex}
li.s .k svg{width:17px;height:17px;color:var(--accent)}
li.s.x .t{opacity:.42}
li.s.x .t>span:first-child{text-decoration:line-through}
.t em{font-style:normal;color:var(--mute);font-size:14px}
.rep{margin:6px 0;padding:4px 12px 4px 14px;background:var(--repbg);border-radius:16px;position:relative}
.rep::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;border-left:2px dashed var(--rep);opacity:.7}
.rep>.lab{font-size:13.5px;color:var(--rep);padding:7px 0 3px}
.rep>.lab .z{display:inline;margin-left:6px;font-size:13px}
body.noz .rep>.lab .z{display:none}
.rep li.s{border-top-color:color-mix(in srgb,var(--rep) 22%,transparent)}
.note{margin-top:10px;font-size:13.5px;color:var(--mute);background:var(--bg);border-radius:14px;padding:9px 12px;white-space:pre-line}
.timer{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:8px 8px 8px 14px;margin-bottom:8px;min-height:48px}
.tinfo{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.tinfo b{font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.tinfo b.live{color:var(--accent)}
.tmuted{font-size:12.5px;color:var(--mute)}
.tspace{flex:1}
.tb{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.tb.ghost{background:var(--card);color:var(--ink)}
.tx{border:0;background:none;color:var(--mute);font-size:12.5px;padding:8px 6px}
.rf{display:flex;gap:8px;margin-top:10px}
.rf button{flex:1;border:1.5px solid var(--line);background:none;border-radius:14px;padding:9px;font-size:14px;color:var(--mute)}

/* cards */
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:14px;color:var(--mute);font-weight:400}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv b{font-weight:400;color:var(--mute)}
.big{font-size:28px;line-height:1.2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats div span{display:block;font-size:12.5px;color:var(--mute)}
.stats div b{font-weight:400;font-size:20px}
.tl{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1.5px dashed var(--line);font-size:14.5px}
.tl:first-of-type{border-top:0}
.tl .l{min-width:48px}
.tl .m{flex:1;color:var(--mute);font-size:13px}
.tl .d{font-variant-numeric:tabular-nums}
.pages img{display:block;width:100%;border-radius:16px;margin-bottom:6px;background:#fff}
.pages .pg{margin-bottom:14px}
.pages .pg.zoom{overflow:auto;border-radius:16px}
.pages .pg.zoom img{width:230%;max-width:none}
.pages .pa{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);padding:0 4px}
.pages .pa button{border:0;background:none;color:var(--accent);font-size:13px;padding:4px}
.ttl{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;font-size:17px}
.btn{display:block;width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px;font-size:16px;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.btn.danger{background:none;color:#c0634f;border:1.5px solid var(--line)}
.btn:disabled{opacity:.5}
.list{margin:0;padding-left:20px;font-size:15px}
.sp{white-space:pre-line;font-size:15px}

/* new */
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--seam);border-radius:24px;padding:28px 16px;text-align:center;color:var(--mute);background:var(--card)}
.drop svg{width:100px;height:88px}
.drop b{color:var(--ink);font-weight:400;font-size:17px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#fff;box-shadow:var(--sh)}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--mute)}
.steps li.on{color:var(--ink)}
.steps li.ok{color:var(--ink)}
.steps li i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.steps li.on i{border-color:var(--accent);border-top-color:transparent;animation:sp 1s linear infinite}
.steps li.ok i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#c0634f;font-size:14px;margin-top:10px;white-space:pre-line}
.hint{font-size:13px;color:var(--mute);margin:8px 4px}

/* fabs + sheet */
.fab{position:fixed;right:16px;z-index:6;border:0;box-shadow:0 6px 18px -6px rgba(120,80,50,.45)}
.fab.yarn{bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--card);font-size:25px;line-height:1;outline:1.5px dashed var(--seam);outline-offset:-6px}
.fab.jump{bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:14px 18px;border-radius:999px;font-size:15px}
.mask{position:fixed;inset:0;background:rgba(40,25,15,.35);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--bg);border-radius:26px 26px 0 0;max-height:86vh;max-height:86dvh;overflow:auto;transform:translateY(105%);transition:transform .25s;padding:0 14px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;-webkit-overflow-scrolling:touch}
body.sh .mask{opacity:1;pointer-events:auto}body.sh .sheet{transform:none}
.shead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:16px 4px 10px;z-index:1}
.shead b{font-weight:400;font-size:18px}
.x{border:0;background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;box-shadow:var(--sh)}
.tog{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:12px;font-size:15px;box-shadow:var(--sh)}
.sw{width:48px;height:29px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}.sw.on::after{left:22px}
.ref{background:var(--card);border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
.ref h3{margin:0;padding:12px 16px 4px;font-size:13px;color:var(--mute);font-weight:400}
.rr{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:8px;align-items:center;padding:10px 16px;border-top:1.5px dashed var(--line);font-size:14px;line-height:1.35}
.rr.nos{grid-template-columns:1.1fr 1fr 1fr}
.rr.two{grid-template-columns:1fr 1.4fr}
.rr.hd{font-size:12px;color:var(--mute);padding-top:2px;padding-bottom:6px;border-top:0}
.rr .en{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.rr svg{width:28px;height:28px}
.tip{font-size:13px;color:var(--mute);background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:12px;line-height:1.7;box-shadow:var(--sh)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub{border-radius:18px;padding:10px 14px;font-size:15px;max-width:92%;white-space:pre-wrap;line-height:1.65}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.bub.a{align-self:flex-start;background:var(--card);box-shadow:var(--sh);border-bottom-left-radius:6px}
.bub.a.wait{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px}
.ask{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:6px}
.ask textarea{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;font-size:15px;resize:none;min-height:46px}
.ask button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:0 16px;font-size:15px}
.ta{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;font-size:14.5px;resize:vertical;min-height:120px;font-family:ui-monospace,Menlo,monospace}
.ctx{font-size:13px;color:var(--mute);background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-family:ui-monospace,Menlo,monospace;line-height:1.5}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--sh);margin-bottom:16px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:10px;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.search{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:11px 14px;font-size:15px;margin-bottom:10px}
.chips2{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chips2 button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--mute)}
.chips2 button.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent)}
.yc{display:flex;gap:12px;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:10px;margin-bottom:10px;align-items:center;cursor:pointer}
.yc .ph{width:68px;height:68px;border-radius:14px;overflow:hidden;background:var(--repbg);flex:none;display:flex;align-items:center;justify-content:center}
.yc .ph img{width:100%;height:100%;object-fit:cover}
.yc .ph svg{width:44px;height:44px}
.yc .in{flex:1;min-width:0;line-height:1.4}
.yc .t1{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yc .t2{font-size:13px;color:var(--mute)}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;margin-right:6px;background:var(--repbg)}
.pill.new{background:color-mix(in srgb,#8fae8b 25%,var(--card))}
.pill.using{background:color-mix(in srgb,var(--accent) 25%,var(--card))}
.pill.left{background:color-mix(in srgb,#8fa3b5 25%,var(--card))}
.fm label{display:block;font-size:13px;color:var(--mute);margin:10px 2px 4px}
.fm input,.fm select,.fm textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-size:15.5px}
.fm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fm .qty{display:grid;grid-template-columns:1fr 90px;gap:8px}
.fm label.ybtn{display:flex;color:var(--accent);font-size:15px;margin:0}
.yphoto{display:flex;gap:10px;align-items:center}
.yphoto img{width:84px;height:84px;object-fit:cover;border-radius:16px}
.ybtn{flex:1;display:flex;align-items:center;justify-content:center;border:2px dashed var(--seam);border-radius:16px;padding:14px;color:var(--accent);font-size:15px;cursor:pointer;background:var(--card)}
.ylink{display:flex;gap:8px;flex-wrap:wrap}
.ylink button{display:flex;align-items:center;gap:6px;border:0;background:var(--bg);border-radius:999px;padding:4px 12px 4px 4px;font-size:13.5px}
.ylink img,.ylink .dot{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--repbg);display:block}
.pick{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer}
.pick .ph{width:44px;height:44px;border-radius:12px;overflow:hidden;background:var(--repbg);flex:none}
.pick .ph img{width:100%;height:100%;object-fit:cover}
.pick span{flex:1;font-size:14.5px}
.pick i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);font-style:normal;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-size:13px}
.pick.on i{background:var(--accent);border-color:var(--accent)}
.ent{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.ent .eh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-bottom:6px}
.ent .eh b{font-weight:400;background:var(--repbg);color:var(--ink);border-radius:999px;padding:1px 9px}
.ent .eh button{margin-left:auto;border:0;background:none;color:var(--mute);font-size:13px;padding:2px 4px}
.ent p{margin:0;white-space:pre-wrap;font-size:15px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;background:var(--repbg)}
.ev{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--mute);padding:4px 6px 12px}
.ev svg{width:15px;height:15px;color:var(--accent)}
.dayh{font-size:13px;color:var(--mute);margin:18px 6px 8px}
.ph2{position:relative}
.ph2 button{position:absolute;top:4px;right:4px;border:0;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1}
.mt2{width:100%;min-height:220px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px;font-size:14.5px;line-height:1.7;resize:vertical}
.sgal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sgal div{position:relative}
.sgal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.sgal button{position:absolute;bottom:6px;left:6px;right:6px;border:0;border-radius:999px;background:rgba(255,250,242,.92);color:#5a4636;font-size:12.5px;padding:5px}
.snack{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:.25s;pointer-events:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.snack.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.snack button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 14px;font-size:14px}
.wip{padding:14px 16px 10px}
.wip .wh{display:flex;align-items:center;justify-content:space-between}
.wip .wh h2{margin:0}
.wip .wh button{border:0;background:none;color:var(--mute);font-size:13px;padding:6px 2px}
.wip .chips2{margin:10px 0 6px}
.wr{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1.5px dashed var(--line);cursor:pointer}
.wr:first-child{border-top:0}
.wr .wn{flex:1;min-width:0;line-height:1.35}
.wr .wn b{font-weight:400;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr .wn small{color:var(--mute);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr .go{font-size:12.5px;color:var(--mute)}
.pill.knit{background:color-mix(in srgb,var(--accent) 25%,var(--card))}
.pill.ends{background:color-mix(in srgb,#8fae8b 28%,var(--card))}
.pill.done{background:var(--line);color:var(--mute)}
.wr.isdone .wn b{color:var(--mute);text-decoration:line-through}
.wadd{display:flex;gap:8px;margin-top:8px}
.wadd input{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 12px;font-size:15px;min-width:0}
.wadd button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;width:44px;font-size:20px}
.wmore{display:block;width:100%;border:0;background:none;color:var(--mute);font-size:13px;padding:8px 0 2px}
.ph2 .crp{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:999px;padding:2px 8px;pointer-events:none}
.ph2 img{cursor:pointer}
.crop{position:fixed;inset:0;z-index:40;background:#1c140e;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.crop .ct{color:#f1e5d6;text-align:center;font-size:14px;margin:4px 0 10px}
.crop .cw{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.crop .cw img{max-width:100%;max-height:100%;display:block;pointer-events:none;-webkit-touch-callout:none}
.crop .cr{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border-radius:4px;pointer-events:none}
.crop .cb{display:flex;gap:10px}
.crop .cb .btn{margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab yarn hide" id="fabRef" aria-label="記號速查">🧶</button>
<button class="fab jump hide" id="fabJump">跳到目前</button>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="snack" id="snack"><span id="snackT"></span><button id="snackB">記一筆</button></div>
<script>
const SHEEP=`<svg viewBox="0 0 64 56" aria-hidden="true"><g fill="var(--wool)" stroke="var(--woolline)" stroke-width="1.4"><circle cx="18" cy="26" r="10"/><circle cx="30" cy="18" r="11"/><circle cx="44" cy="20" r="10"/><circle cx="50" cy="31" r="9"/><circle cx="24" cy="36" r="11"/><circle cx="40" cy="38" r="11"/></g><rect x="22" y="44" width="4" height="9" rx="2" fill="var(--face)"/><rect x="38" y="45" width="4" height="8" rx="2" fill="var(--face)"/><ellipse cx="14" cy="29" rx="4.5" ry="2.6" fill="var(--face)" transform="rotate(-30 14 29)"/><ellipse cx="34" cy="29" rx="4.5" ry="2.6" fill="var(--face)" transform="rotate(30 34 29)"/><ellipse cx="24" cy="31" rx="8" ry="9" fill="var(--face)"/><circle cx="21" cy="29.5" r="1.3" fill="#fff"/><circle cx="27" cy="29.5" r="1.3" fill="#fff"/><circle cx="19" cy="34" r="1.8" fill="var(--pad)"/><circle cx="29" cy="34" r="1.8" fill="var(--pad)"/><circle cx="20" cy="22" r="4" fill="var(--wool)" stroke="var(--woolline)" stroke-width="1.2"/><circle cx="27" cy="21" r="4" fill="var(--wool)" stroke="var(--woolline)" stroke-width="1.2"/></svg>`;
const PAW=`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="12" cy="16" rx="5.2" ry="4.4"/><circle cx="5.6" cy="10.5" r="2.3"/><circle cx="9.4" cy="6.3" r="2.3"/><circle cx="14.6" cy="6.3" r="2.3"/><circle cx="18.4" cy="10.5" r="2.3"/></svg>`;

const S={projects:[],wf:'all',showDone:false,yarns:[],journal:[],ytab:'all',yq:'',ready:false,err:null,db:null,user:null,assets:null,sample:null,uid:null,patterns:[],prog:{},dirty:{},tab:'rows',draft:null,open:new Set(),sig:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\(([^)]*)\)/g,'<em>($1)</em>');
const blobUrl=id=>id?CFG.url+'/img/'+id:'';
let showZ=true;try{showZ=localStorage.getItem('knitbook-z')!=='0'}catch(e){}
document.body.classList.toggle('noz',!showZ);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function route(){const h=decodeURIComponent(location.hash.slice(1)||'/');const m=h.match(/^\/p\/(.+)$/);return m?{name:'p',id:m[1]}:h==='/new'?{name:'new'}:h==='/yarn'?{name:'yarn'}:h==='/settings'?{name:'settings'}:{name:'home'}}
const curPat=()=>{const r=route();return r.name==='p'?S.patterns.find(p=>p.id===r.id):null};

/* ---------- time ---------- */
const pad2=n=>String(n).padStart(2,'0');
function clock(ts){const d=new Date(ts),n=new Date();const hm=pad2(d.getHours())+':'+pad2(d.getMinutes());return d.toDateString()===n.toDateString()?hm:(d.getMonth()+1)+'/'+d.getDate()+' '+hm}
function day(ts){const d=new Date(ts);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()}
function dur(ms){const m=Math.round(ms/60000);if(ms<60000)return Math.max(1,Math.round(ms/1000))+' 秒';if(m<60)return m+' 分';const h=Math.floor(m/60);return h+' 小時'+(m%60?' '+(m%60)+' 分':'')}
function live(ms){const s=Math.floor(ms/1000);const h=Math.floor(s/3600);return (h?h+':'+pad2(Math.floor(s/60)%60):Math.floor(s/60))+':'+pad2(s%60)}

/* ---------- progress ---------- */
function P(pid){return S.prog[pid]||(S.prog[pid]={rows:{},steps:{},timers:{}})}
const Q={};
function saveP(pid){const pp=P(pid);pp.rev=(pp.rev||0)+1;S.dirty[pid]=(S.dirty[pid]||0)+1;clearTimeout(Q[pid+'t']);Q[pid+'t']=setTimeout(()=>flush(pid),350)}
async function flush(pid){
  if(Q[pid]){Q[pid+'again']=true;return}
  Q[pid]=true;const n=S.dirty[pid];
  try{await S.gcol.doc(pid).set({...P(pid),updatedAt:Date.now()})}catch(e){toast('進度沒存到,請檢查連線')}
  Q[pid]=false;
  if(Q[pid+'again']){Q[pid+'again']=false;flush(pid);return}
  if(S.dirty[pid]===n)delete S.dirty[pid];
}
const tm=(pid,rid)=>{const p=P(pid);return p.timers[rid]||(p.timers[rid]={segs:[]})};
const elapsed=(t,now=Date.now())=>(t?.segs||[]).reduce((a,s)=>a+((s.e||now)-s.s),0);
const running=t=>{const l=t?.segs?.[t.segs.length-1];return !!l&&!l.e};
function stopAll(pid,except){const p=P(pid);for(const k in p.timers){if(k!==except&&running(p.timers[k]))p.timers[k].segs[p.timers[k].segs.length-1].e=Date.now()}}
function units(parts){let u=0;for(const p of parts||[]){if(p.e!=null)u++;else{const m=String(p.rep||'').match(/\d+/);u+=units(p.s)*(m?+m[0]:1)}}return u}
function stats(pat){
  const p=P(pat.id);let total=0,dU=0,dMs=0,rU=0,first=null,last=null,done=0;
  pat.rows.forEach(r=>{const t=p.timers[r.id];const ms=elapsed(t);total+=ms;const u=units(r.parts)||1;
    if(t?.segs?.length){first=Math.min(first??Infinity,t.segs[0].s);const le=t.segs[t.segs.length-1].e;if(le)last=Math.max(last??0,le)}
    if(p.rows[r.id]){done++;if(ms>0&&!running(t)){dU+=u;dMs+=ms}}else rU+=u});
  const rate=dU?dMs/dU:null,rem=rate!=null?rate*rU:null;
  return {total,rem,est:rem!=null?total+rem:null,first,last,done,timedRows:dU>0};
}

/* ---------- storage (Cloudflare Worker) ---------- */
const CFG={url:(localStorage.getItem('kb-url')||'').replace(/\/+$/,''),pass:localStorage.getItem('kb-pass')||''};
const clone=o=>JSON.parse(JSON.stringify(o??null));
const rid32=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function api(method,path,body,type){
  const r=await fetch(CFG.url+path,{method,headers:{'X-Pass':CFG.pass,...(type?{'Content-Type':type}:{})},body});
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e}
  return (r.headers.get('content-type')||'').includes('json')?r.json():r.text();
}
const LISTS={patterns:'patterns',yarns:'yarns',journal:'journal',projects:'projects'};
const SORT={patterns:(x,y)=>(y.createdAt||0)-(x.createdAt||0),yarns:(x,y)=>(y.createdAt||0)-(x.createdAt||0),journal:(x,y)=>(x.at||0)-(y.at||0),projects:(x,y)=>(y.updatedAt||0)-(x.updatedAt||0)};
function localGet(name,id){return name==='progress'?S.prog[id]:S[LISTS[name]].find(x=>x.id===id)}
function localSet(name,id,doc){
  if(name==='progress'){saveCache();return}
  const arr=S[LISTS[name]].filter(x=>x.id!==id);if(doc)arr.push({id,...doc});arr.sort(SORT[name]);S[LISTS[name]]=arr;
  saveCache();if(route().name!=='new')render();
}
function coll(name){return{doc:id=>({
  async set(d){const doc=clone(d);delete doc.id;await api('PUT',`/doc/${name}/${id}`,JSON.stringify(doc),'application/json');localSet(name,id,doc)},
  async update(o){const cur=clone(localGet(name,id)||{});const doc={...cur,...clone(o)};delete doc.id;await api('PUT',`/doc/${name}/${id}`,JSON.stringify(doc),'application/json');localSet(name,id,doc)},
  async delete(){await api('DELETE',`/doc/${name}/${id}`);if(name==='progress')delete S.prog[id];localSet(name,id,null)}
})}}
function saveCache(){try{localStorage.setItem('kb-cache',JSON.stringify({patterns:S.patterns,yarns:S.yarns,journal:S.journal,projects:S.projects,prog:S.prog}))}catch(e){}}
function applyAll(d){
  const toArr=(o,name)=>Object.entries(o||{}).map(([id,v])=>({id,...v})).sort(SORT[name]);
  S.patterns=toArr(d.patterns,'patterns');S.yarns=toArr(d.yarns,'yarns');S.journal=toArr(d.journal,'journal');S.projects=toArr(d.projects,'projects');
  Object.entries(d.progress||{}).forEach(([id,v])=>{if(S.dirty[id])return;const cur=S.prog[id];if(!cur||(v.rev||0)>(cur.rev||0))S.prog[id]=v});
  saveCache();
}
async function load(quiet){
  try{applyAll(await api('GET','/all'));S.err=null;S.ready=true;S.offline=false}
  catch(e){if(e.status===401){S.err='setup';S.authFail=true}else{S.offline=true;if(!quiet)toast('連不上伺服器,先顯示上次的資料')}}
  if(route().name!=='new')render();
}
async function init(){
  S.wcol=coll('projects');S.pcol=coll('patterns');S.gcol=coll('progress');S.ycol=coll('yarns');S.jcol=coll('journal');
  S.assets={async upload(blob){const id=rid32();await api('PUT','/img/'+id,blob,blob.type||'image/jpeg');return{id}},async delete(id){await api('DELETE','/img/'+id)}};
  if(!CFG.url||!CFG.pass){S.err='setup';render();return}
  try{const c=JSON.parse(localStorage.getItem('kb-cache')||'null');if(c){S.patterns=c.patterns||[];S.yarns=c.yarns||[];S.journal=c.journal||[];S.projects=c.projects||[];S.prog=c.prog||{};S.ready=true}}catch(e){}
  render();await load();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.ready&&!Object.keys(S.dirty).length&&route().name!=='new')load(true)});

/* ---------- render ---------- */
function render(){
  const r=route(),app=$('#app');
  $('#fabRef').classList.toggle('hide',r.name!=='p'||!S.ready);
  $('#fabJump').classList.toggle('hide',!(r.name==='p'&&S.tab==='rows'&&S.ready));
  if(r.name==='settings'||S.err==='setup'){app.innerHTML=vSetup();return}
  if(S.err){app.innerHTML=vErr();return}
  if(!S.ready){app.innerHTML=`<div class="wrap"><div class="empty">${SHEEP}<p>整理毛線中…</p></div></div>`;return}
  S.drawn=true;
  if(r.name==='new'){app.innerHTML=vNew();return}
  if(r.name==='p'){const pat=curPat();if(!pat){app.innerHTML=`<div class="wrap"><div class="empty">${SHEEP}<p>找不到這份織圖</p><a class="btn ghost" href="#/" style="text-decoration:none">回織圖本</a></div></div>`;return}app.innerHTML=vPattern(pat);return}
  if(r.name==='yarn'){app.innerHTML=vYarnHome();return}
  app.innerHTML=vHome();
}
function vErr(){return `<div class="wrap"><div class="empty">${SHEEP}<p>讀取資料時出了點問題,請重新整理頁面。</p></div></div>`}
function vSetup(){
  const first=!CFG.url||!CFG.pass;
  return `<div class="wrap">${first?`<div class="hero">${SHEEP}<div><h1>織圖本</h1><p>先連上你的 Cloudflare Worker</p></div></div>`:`<header class="ph" style="margin:-14px -14px 14px"><div class="in"><div class="top" style="padding-bottom:10px"><a class="back" href="#/" aria-label="返回">‹</a><h1>設定</h1></div></div></header>`}
  <div class="card fm"><h2>連線</h2>
  <label>Worker 網址</label><input id="surl" value="${esc(CFG.url)}" placeholder="https://knitbook.你的帳號.workers.dev" autocapitalize="off" autocorrect="off">
  <label>通行碼</label><input id="spass" type="password" value="${esc(CFG.pass)}" autocomplete="current-password">
  ${S.authFail?'<p class="err">通行碼不對,請重新輸入。</p>':''}
  <button class="btn" data-act="sconn">連線</button></div>
  ${first?'':`<div class="card"><h2>備份</h2><p class="hint" style="margin:0 0 4px">匯出的檔案包含織圖、進度、毛線和日記的文字資料,不含照片。</p>
  <button class="btn ghost" data-act="export">匯出備份</button>
  <label class="btn ghost" style="text-align:center;cursor:pointer">匯入資料<input type="file" id="importf" accept="application/json,.json" hidden></label>
  <p class="hint" id="imst"></p></div>
  <div class="card"><h2>這台裝置</h2><p class="hint" style="margin:0">資料存在雲端,換裝置只要輸入一樣的網址和通行碼就好。</p><button class="btn danger" data-act="logout">在這台裝置登出</button></div>`}
  </div>`;
}
async function doImport(file){
  const st=$('#imst');
  try{
    const d=JSON.parse(await file.text());const docs=d.docs||d;const imgs=d.images||{};
    const ids=Object.keys(imgs);let n=0;
    for(const id of ids){st.textContent=`上傳照片 ${++n} / ${ids.length}…`;const im=imgs[id];const bin=Uint8Array.from(atob(im.b64),c=>c.charCodeAt(0));await api('PUT','/img/'+id,new Blob([bin],{type:im.type||'image/jpeg'}),im.type||'image/jpeg')}
    for(const c of ['patterns','progress','yarns','journal','projects']){for(const [id,v] of Object.entries(docs[c]||{})){st.textContent=`寫入資料 ${c}/${id}…`;await api('PUT',`/doc/${c}/${id}`,JSON.stringify(v),'application/json')}}
    st.textContent='匯入完成!';await load();
  }catch(e){st.textContent='匯入失敗:'+(e.status===401?'通行碼不對':'檔案格式不對或連線中斷')}
}
function vHome(){
  const cards=S.patterns.map(p=>{
    const st=stats(p),n=p.rows.length,pct=n?Math.round(st.done/n*100):0;
    return `<a class="pc" href="#/p/${encodeURIComponent(p.id)}"><div class="cv">${p.cover||p.pages?.[0]?`<img src="${blobUrl(p.cover||p.pages[0])}" alt="" loading="lazy">`:SHEEP}</div>
    <div class="nm">${esc(p.title||'未命名織圖')}</div><div class="mt">${st.done} / ${n} 段${st.total?'・'+dur(st.total):''}</div><div class="mini"><i style="width:${pct}%"></i></div></a>`}).join('');
  return `<div class="wrap">${homeHead('p')}
  <button class="add" data-act="new">＋ 新增織圖</button>
  ${S.patterns.length?`<div class="grid">${cards}</div>`:`<div class="empty"><p>還沒有織圖。<br>貼上織圖文字,會自動分段整理。</p></div>`}</div>`;
}

/* pattern */
function curRow(pat){const p=P(pat.id);return (pat.rows.find(r=>!p.rows[r.id])||{}).id}
function vPattern(pat){
  const st=stats(pat),n=pat.rows.length;
  const tabs=[['rows','段落'],['pages','原圖'],['log','日記'],['info','資訊']];
  let body='';
  if(S.tab==='rows'){const cur=curRow(pat);body=pat.rows.map(r=>rowHTML(pat,r,cur)).join('')}
  else if(S.tab==='pages')body=vPages(pat);
  else if(S.tab==='log')body=vDiary(pat,st);
  else body=vInfo(pat);
  return `<header class="ph"><div class="in"><div class="top"><a class="back" href="#/" aria-label="回織圖本">‹</a><h1>${esc(pat.title||'未命名織圖')}</h1><span class="prog">${st.done} / ${n} 段</span></div>
  <div class="bar"><i style="width:${n?st.done/n*100:0}%"></i></div>
  <nav class="tabs">${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</nav></div></header>
  <div class="wrap">${body}</div>`;
}
function stepsHTML(parts,id,p){
  let k=0,h='<ol>';
  (parts||[]).forEach((q,i)=>{const sid=id+'-'+i;
    if(q.e!=null){k++;const x=p&&p.steps[sid];h+=`<li class="s${x?' x':''}" data-sid="${sid}" data-k="${k}"><span class="k">${x?PAW:k}</span><span class="t"><span>${fmt(q.e)}</span>${q.z?`<span class="z">${esc(q.z)}</span>`:''}</span></li>`}
    else h+=`</ol><div class="rep"><div class="lab">↻ ${esc(q.rep)}${q.repz?`<span class="z">${esc(q.repz)}</span>`:''}</div>${stepsHTML(q.s,sid,p)}</div><ol>`});
  return h+'</ol>';
}
function timerHTML(pid,rid,done){
  const t=P(pid).timers[rid],segs=t?.segs||[],run=running(t),ms=elapsed(t);
  if(!segs.length)return done?'':`<div class="timer"><span class="tmuted">還沒開始計時</span><span class="tspace"></span><button class="tb" data-act="start">▶ 開始</button></div>`;
  const last=segs[segs.length-1];
  const range=clock(segs[0].s)+' – '+(run?'進行中':clock(last.e))+(segs.length>1?`・分 ${segs.length} 次`:'');
  const btn=done?'':run?`<button class="tb ghost" data-act="pause">⏸ 暫停</button>`:`<button class="tb" data-act="start">▶ 繼續</button>`;
  return `<div class="timer"><span class="tinfo"><b class="${run?'live':''}" ${run?`data-live="${pid}|${rid}"`:''}>${run?live(ms):dur(ms)}</b><span class="tmuted">${range}</span></span>${btn}<button class="tx" data-act="treset">重設</button></div>`;
}
function rowHTML(pat,r,cur){
  const p=P(pat.id),done=!!p.rows[r.id],open=S.open.has(r.id);
  return `<div class="row${done?' done':''}${r.id===cur?' cur':''}${open?' open':''}" id="row-${r.id}" data-rid="${r.id}">

/* ---------- local parser ---------- */
const LABEL=/^\s*(Base|Foundation|R(?:ound|nd|d)?\s*\.?\s*\d+(?:\s*[-–~〜]\s*\d+)?|Rows?\s*\d+(?:\s*[-–~〜]\s*\d+)?|第\s*\d+(?:\s*[-–~〜]\s*\d+)?\s*段|\d+(?:\s*[-–~〜]\s*\d+)?\s*段目)(?![A-Za-z])\s*[:：.)\-–]?\s*/i;
function normLabel(s){s=s.trim();let m=s.match(/^R(?:ound|nd|d)?\s*\.?\s*(\d+(?:\s*[-–~〜]\s*\d+)?)$/i);if(m)return 'R'+m[1].replace(/\s+/g,'').replace(/[–~〜]/,'-');m=s.match(/^Rows?\s*(.+)$/i);if(m)return 'Row '+m[1].replace(/\s+/g,'');return /^(base|foundation)$/i.test(s)?'Base':s.replace(/\s+/g,'')}
function splitCount(raw){
  let m=raw.match(/\s*[(\[（]([^()\[\]（）]*\d[^()\[\]（）]*)[)\]）]\s*\.?\s*$/);
  if(m&&/\b(sts?|stitch(es)?|dcs?|scs?|hdcs?|trs?|ch|sps?|spaces?|dc2tog)\b|目|針|個/i.test(m[1]))return {raw:raw.slice(0,m.index).trim(),count:m[1].trim()};
  m=raw.match(/\s*[-–—=]\s*(\d+\s*(?:sts?|stitches|目)[^,;]*)\.?\s*$/i);
  if(m)return {raw:raw.slice(0,m.index).trim(),count:m[1].trim()};
  return {raw,count:''};
}
const restoreMk=s=>s.replace(/☆/g,'*').replace(/⁑/g,'**-**').replace(/⁂/g,'*-*').replace(/§/g,'**');
function splitTop(s){
  const out=[];let d=0,cur='';
  for(let i=0;i<s.length;i++){const c=s[i];
    if('([（'.includes(c))d++;else if(')]）'.includes(c))d=Math.max(0,d-1);
    const isSep=d===0&&(',;、，；。'.includes(c)||(c==='.'&&!/\d/.test(s[i-1]||'')&&(i===s.length-1||/\s/.test(s[i+1]))));
    if(isSep){out.push(cur);cur=''}else cur+=c}
  out.push(cur);return out;
}
function simple(s){return splitTop(s).map(x=>restoreMk(x).trim().replace(/[.。]$/,'').trim()).filter(x=>x&&!/^[\s,.;:]+$/.test(x)).map(e=>({e,z:''}))}
const REPRE=/^\s*[,.;、。]?\s*((?:rep(?:eat)?|work)\b[^,;.、。]*)/i;
function seq(s){
  const out=[];
  while(s.length){
    const idx=['§','*','['].map(c=>s.indexOf(c)).filter(i=>i>=0);
    if(!idx.length){out.push(...simple(s));break}
    const i=Math.min(...idx),ch=s[i];out.push(...simple(s.slice(0,i)));
    if(ch==='['){
      let d=0,j=-1;for(let k=i;k<s.length;k++){if(s[k]==='[')d++;else if(s[k]===']'){d--;if(!d){j=k;break}}}
      if(j<0){out.push(...simple(s.slice(i+1)));break}
      const inner=s.slice(i+1,j);let rest=s.slice(j+1);const rm=rest.match(/^\s*(?:x\s*(\d+)|(\d+)\s*(?:times|x)\b)/i);
      if(rm){out.push({rep:'repeat '+(rm[1]||rm[2])+' times',repz:'',s:seq(inner)});rest=rest.slice(rm[0].length)}else out.push(...simple('('+inner+')'));
      s=rest;continue;
    }
    const j=s.indexOf(ch,i+1);
    if(j<0){
      const rest=s.slice(i+1);const rm=rest.match(/[,;.、。]?\s*((?:rep(?:eat)?)\b[^,;.、。]*)/i);
      if(rm){out.push({rep:restoreMk(rm[1].trim()),repz:'',s:seq(rest.slice(0,rm.index))});s=rest.slice(rm.index+rm[0].length);continue}
      out.push(...simple(rest));break;
    }
    const inner=s.slice(i+1,j);let rest=s.slice(j+1);const rm=rest.match(REPRE);let label='repeat';
    if(rm){label=restoreMk(rm[1].trim());rest=rest.slice(rm[0].length)}
    out.push({rep:label,repz:'',s:seq(inner)});s=rest;
  }
  return out;
}
function parseSteps(raw){return seq(raw.replace(/(rep(?:eat)?\s+from\s+)\*/gi,'$1☆').replace(/\*\*\s*-\s*\*\*/g,'⁑').replace(/\*\s*-\s*\*/g,'⁂').replace(/\*\*/g,'§'))}
function parsePattern(text){
  const rows=[],pre=[];
  for(const ln of text.replace(/\r/g,'').split('\n')){
    const t=ln.trim();if(!t)continue;const m=t.match(LABEL);
    if(m)rows.push({label:normLabel(m[1]),raw:t.slice(m[0].length).trim()});
    else if(rows.length)rows[rows.length-1].raw+=(rows[rows.length-1].raw?' ':'')+t;
    else pre.push(t);
  }
  return {notes:pre,rows:rows.map((r,i)=>{const c=splitCount(r.raw);return{id:'r'+i,label:r.label,raw:c.raw,count:c.count,countZh:'',parts:parseSteps(c.raw),note:''}})};
}

function loadPdfJs(){return new Promise((res,rej)=>{if(window.pdfjsLib)return res(window.pdfjsLib);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)};s.onerror=()=>rej(new Error('pdf'));document.head.append(s)})}

async function imgToJpeg(file){
  const bmp=await createImageBitmap(file);const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);return toJpeg(c);

async function pickFiles(files){

        for(let i=1;i<=Math.min(pdf.numPages,12);i++){const pg=await pdf.getPage(i);const v0=pg.getViewport({scale:1});const v=pg.getViewport({scale:1600/v0.width});

let OCRW=null,OCRL='',OCRLOG=null;
async function getOCR(langs,logger){

function materialText(pat){
  const p=P(pat.id),st=stats(pat);const ys=(pat.yarnIds||[]).map(id=>S.yarns.find(y=>y.id===id)).filter(Boolean);
  const L=[`《${pat.title||'未命名織圖'}》`];
  if(pat.designer)L.push('設計:'+pat.designer);
  if(pat.size)L.push('尺寸:'+pat.size);
  ys.forEach(y=>L.push('用線:'+yName(y)+(y.material?'('+y.material+')':'')));
  const hooks=[...new Set(ys.map(y=>y.hook).filter(Boolean))];if(hooks.length)L.push('針號:'+hooks.join('、'));
  const items=diaryItems(pat);
  if(st.first)L.push('開工:'+day(st.first));

  else L.push(`進度:${st.done} / ${pat.rows.length} 段`);
  if(st.total)L.push('總用時:'+dur(st.total));
  const byDay={};items.forEach(it=>{(byDay[day(it.at)]=byDay[day(it.at)]||[]).push(it)});

  const html=`<p class="hint" style="margin-top:0">依日期排好的素材,複製後貼到備忘錄或 Threads 草稿再慢慢寫。</p>
  <textarea class="mt2" id="mtxt" readonly>${esc(txt)}</textarea><button class="btn" id="mcopy">複製文字</button>
  <div class="card" style="margin-top:14px"><h2>照片 ${photos.length} 張</h2>${photos.length?`<div class="sgal">${photos.map((id,i)=>`<div><img src="${blobUrl(id)}" alt="" loading="lazy"><button data-sv="${id}" data-i="${i+1}">存到手機</button></div>`).join('')}</div>${photos.length>1?'<button class="btn ghost" id="mall">全部存到手機</button>':''}`:'<p class="hint" style="margin:0">還沒有照片,記一筆時可以加。</p>'}</div>`;
  openSheet('整理素材',html,sh=>{
    sh.querySelector('#mcopy').onclick=()=>copyText(txt);
    const base=(pat.title||'knitbook').replace(/[^\w\u4e00-\u9fff-]+/g,'').slice(0,20)||'knitbook';
    sh.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>savePhoto(b.dataset.sv,`${base}-${b.dataset.i}.jpg`));
    const all=sh.querySelector('#mall');if(all)all.onclick=async function(){this.disabled=true;await shareFiles(photos,base);this.disabled=false};
  });
}

/* ---------- events ---------- */
document.addEventListener('keydown',e=>{if(e.target.id==='wipnew'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();wipAdd()}});
document.addEventListener('input',e=>{if(e.target.id==='ysearch'){S.yq=e.target.value;const l=$('#ylist');if(l)l.innerHTML=yarnList()}});
document.addEventListener('change',e=>{if(e.target.id==='file'&&e.target.files.length)pickFiles([...e.target.files]);if(e.target.id==='importf'&&e.target.files[0])doImport(e.target.files[0])});
document.addEventListener('focusout',async e=>{
  if(e.target.id!=='ttl')return;const pat=curPat();if(!pat)return;const v=e.target.value.trim();if(!v||v===pat.title)return;
  try{await S.pcol.doc(pat.id).update({title:v});toast('已改名')}catch(err){toast('改名失敗')}
});
document.getElementById('app').addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;render();scrollTo(0,0);return}
  const a=e.target.closest('[data-act]');const pat=curPat();
  const act=a?.dataset.act;
  if(act==='new'){location.hash='#/new';return}
  if(act==='preview'){makePreview();return}
  if(act==='back2'){S.draft.status='idle';render();return}
  if(act==='sconn'){connect();return}
  if(act==='export'){exportData();return}
  if(act==='logout'){if(confirm('要在這台裝置登出嗎?雲端資料不會刪除。')){localStorage.removeItem('kb-url');localStorage.removeItem('kb-pass');localStorage.removeItem('kb-cache');location.hash='#/';location.reload()}return}
  if(act==='savep'){savePattern();return}
  if(act==='zoom'){a.classList.toggle('zoom');return}
  if(act==='wiptog'){localStorage.setItem('kb-wipcol',localStorage.getItem('kb-wipcol')==='1'?'0':'1');render();return}
  if(act==='wipf'){S.wf=a.dataset.v;render();return}
  if(act==='wipadd'){wipAdd();return}
  if(act==='wipdone'){S.showDone=!S.showDone;render();return}
  if(act==='wipopen'){const w=S.projects.find(x=>x.id===a.dataset.id);if(w)openWip(w);return}
  if(act==='yseg'){location.hash=a.dataset.v==='y'?'#/yarn':'#/';return}
  if(act==='yfilter'){S.ytab=a.dataset.v;render();return}
  if(act==='yadd'){openYarn(null);return}
  if(act==='yopen'){openYarn(S.yarns.find(y=>y.id===a.dataset.id));return}
  if(!pat){return}
  const p=P(pat.id);
  if(act==='dnote'){openEntry(pat,{rid:curRow(pat)});return}
  if(act==='material'){openMaterial(pat);return}
  if(act==='ylink'){openYarnPick(pat);return}
  if(act==='eedit'){const en=S.journal.find(x=>x.id===a.dataset.id);if(en)openEntry(pat,{entry:en});return}
  if(act==='photo'){openPhoto(a.dataset.id);return}
  if(act==='cover'){try{await S.pcol.doc(pat.id).update({cover:a.dataset.id});toast('已設為封面')}catch(err){toast('設定失敗')}return}
  if(act==='resetp'){if(confirm('要清除這份織圖的所有進度和計時嗎?')){S.prog[pat.id]={rows:{},steps:{},timers:{},rev:P(pat.id).rev||0};saveP(pat.id);render()}return}
  if(act==='delp'){if(confirm(`確定要刪除「${pat.title}」嗎?這份的日記也會一起刪除,刪除後無法復原。`)){try{for(const en of S.journal.filter(x=>x.pid===pat.id)){await S.jcol.doc(en.id).delete().catch(()=>{});(en.photos||[]).forEach(id=>S.assets?.delete(id).catch(()=>{}))}await S.pcol.doc(pat.id).delete();await S.gcol.doc(pat.id).delete().catch(()=>{});if(S.assets)[...new Set([...(pat.pages||[]),pat.cover].filter(Boolean))].forEach(id=>S.assets.delete(id).catch(()=>{}));location.hash='#/'}catch(err){toast('刪除失敗')}}return}
  const rowEl=e.target.closest('.row');const rid=rowEl?.dataset.rid;const r=rid&&pat.rows.find(x=>x.id===rid);
  if(!r){return}
  if(act==='done'){
    e.stopPropagation();const was=!!p.rows[rid];
    if(was)delete p.rows[rid];else{p.rows[rid]=Date.now();snack(`${r.label} 完成了`,()=>openEntry(pat,{rid}));const t=p.timers[rid];if(running(t))t.segs[t.segs.length-1].e=Date.now();S.open.delete(rid)}
    saveP(pat.id);render();
    if(!was){const c=document.querySelector('.row.cur');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})}
    return;
  }
  if(act==='start'){stopAll(pat.id,rid);tm(pat.id,rid).segs.push({s:Date.now()});saveP(pat.id);render();return}
  if(act==='pause'){const t=tm(pat.id,rid);if(running(t))t.segs[t.segs.length-1].e=Date.now();saveP(pat.id);render();return}
  if(act==='treset'){if(confirm(`要重設 ${r.label} 的計時嗎?`)){delete p.timers[rid];saveP(pat.id);render()}return}
  if(act==='note'){openEntry(pat,{rid});return}
  if(act==='edit'){openEdit(pat,r);return}
  const li=e.target.closest('li.s');
  if(li){const sid=li.dataset.sid;if(p.steps[sid])delete p.steps[sid];else p.steps[sid]=true;const x=!!p.steps[sid];li.classList.toggle('x',x);li.querySelector('.k').innerHTML=x?PAW:li.dataset.k;saveP(pat.id);return}
  if(act==='toggle'&&p.rows[rid]){S.open.has(rid)?S.open.delete(rid):S.open.add(rid);rowEl.classList.toggle('open');return}
});
window.addEventListener('hashchange',()=>{S.tab='rows';S.open=new Set();closeSheet();render();scrollTo(0,0)});
setInterval(()=>{document.querySelectorAll('[data-live]').forEach(el=>{const [pid,rid]=el.dataset.live.split('|');el.textContent=live(elapsed(P(pid).timers[rid]))})},1000);
init();
</script>
</body>
</html>
